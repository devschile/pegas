name: Test parser

# El parser de LinkedIn se editaba a mano y se probaba a mano (o no se
# probaba). Esto corre n8n/test-parser.js en cada push/PR que toque el
# parser o sus tests, para que una regresión no llegue a producción sin
# que nadie la note.
on:
  push:
    paths:
      - 'n8n/parser-code.js'
      - 'n8n/test-parser.js'
  pull_request:
    paths:
      - 'n8n/parser-code.js'
      - 'n8n/test-parser.js'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node n8n/test-parser.js
