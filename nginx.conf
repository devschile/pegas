server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cache estática
    location ~* \.(css|js|png|jpg|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # JSON de data - sin cache para ver datos frescos
    location /data/ {
        expires 5m;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin "*";
    }

    # Bloquear dotfiles (.env, .git, etc.) — antes del fallback de abajo,
    # que si no responde 200 con index.html para cualquier ruta inexistente.
    location ~ /\. {
        deny all;
        return 404;
    }

    # SPA fallback (por si acaso). El HTML no se cachea: es quien apunta a los
    # assets versionados, si se quedara pegado seguiria pidiendo los viejos.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
