<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pegas devsChile() — Ofertas de trabajo tech</title>
  <meta name="description" content="Vitrina de ofertas de trabajo tech en Chile. Parseadas desde newsletters de LinkedIn y otras fuentes.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://pegas.devschile.cl/">
  <meta name="theme-color" content="#2dd4bf">
  <meta property="og:title" content="Pegas devsChile() — Ofertas de trabajo tech">
  <meta property="og:description" content="Vitrina de ofertas de trabajo tech en Chile. Parseadas desde newsletters de LinkedIn y otras fuentes.">
  <meta property="og:url" content="https://pegas.devschile.cl/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Pegas devsChile()">
  <meta property="og:image" content="https://pegas.devschile.cl/og-image.png">
  <meta property="og:locale" content="es_CL">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Pegas devsChile() — Ofertas de trabajo tech">
  <meta name="twitter:description" content="Vitrina de ofertas de trabajo tech en Chile. Parseadas desde newsletters de LinkedIn y otras fuentes.">
  <meta name="twitter:image" content="https://pegas.devschile.cl/og-image.png">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>💼</text></svg>">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1 class="site-title">💼 <span>Pegas</span> devsChile()</h1>
      <p class="site-subtitle">Ofertas de trabajo tech desde varias fuentes</p>
    </div>
  </header>

  <main class="container">
    <section class="filters">
      <input type="search" id="search" placeholder="Buscar por título, empresa o descripción..." autocomplete="off">
      <div class="filter-row">
        <select id="filter-categoria">
          <option value="">Todas las categorías</option>
        </select>
        <select id="filter-fuente">
          <option value="">Todas las fuentes</option>
        </select>
      </div>
      <div class="stats">
        <strong id="count-visible">undefined</strong> de <strong id="count-total">NaN</strong> pegas
      </div>
    </section>

    <section id="pegas-list" class="pegas-list">
      <div class="loading">Cargando pegas...</div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <a href="https://devschile.cl">devsChile</a>
      <span class="separator">·</span>
      <a href="https://github.com/devschile/pegas">GitHub</a>
      <span class="separator">·</span>
      datos desde LinkedIn &amp; otras fuentes
    </div>
  </footer>

  <template id="pega-card">
    <article class="pega-card">
      <div class="pega-header">
        <h2 class="pega-titulo"></h2>
        <span class="pega-fecha"></span>
      </div>
      <div class="pega-meta">
        <span class="pega-empleador"></span>
        <span class="pega-badges">
          <span class="badge badge-remote"></span>
          <span class="badge badge-sueldo"></span>
          <span class="badge badge-categoria"></span>
          <span class="badge badge-ubicacion"></span>
        </span>
      </div>
      <p class="pega-descripcion"></p>
      <a class="pega-link" target="_blank" rel="noopener noreferrer">Ver oferta</a>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
