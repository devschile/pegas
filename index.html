<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pegas DevsChile — Ofertas de trabajo tech</title>
  <meta name="description" content="Vitrina de ofertas de trabajo tech en Chile. Parseadas desde newsletters de LinkedIn y otras fuentes.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💼</text></svg>">
</head>
<body>
  <header>
    <div class="container">
      <h1>💼 Pegas DevsChile</h1>
      <p class="subtitle">Ofertas de trabajo tech parseadas desde newsletters</p>
    </div>
  </header>

  <main class="container">
    <!-- Filtros -->
    <section class="filters">
      <input type="search" id="search" placeholder="🔍 Buscar por título, empresa o descripción..." autocomplete="off">
      <div class="filter-row">
        <select id="filter-categoria">
          <option value="">Todas las categorías</option>
        </select>
        <select id="filter-fuente">
          <option value="">Todas las fuentes</option>
        </select>
      </div>
      <div class="stats">
        <span id="count-visible">0</span> de <span id="count-total">0</span> pegas
      </div>
    </section>

    <!-- Listado -->
    <section id="pegas-list" class="pegas-list">
      <div class="loading">Cargando pegas...</div>
    </section>
  </main>

  <footer>
    <div class="container">
      <p>Hecho con ❤️ por <a href="https://devschile.cl">devsChile</a> · 
      Datos desde <a href="https://linkedin.com">LinkedIn</a> y otras fuentes · 
      <a href="https://github.com/devschile/pegas">GitHub</a></p>
    </div>
  </footer>

  <template id="pega-card">
    <article class="pega-card" data-categoria="" data-fuente="">
      <div class="pega-header">
        <h2 class="pega-titulo"></h2>
        <span class="pega-fecha"></span>
      </div>
      <div class="pega-meta">
        <span class="pega-empleador"></span>
        <span class="pega-badges">
          <span class="badge badge-sueldo" style="display:none"></span>
          <span class="badge badge-categoria"></span>
          <span class="badge badge-ubicacion"></span>
          <span class="badge badge-fuente"></span>
        </span>
      </div>
      <p class="pega-descripcion"></p>
      <a class="pega-link" target="_blank" rel="noopener noreferrer">Ver oferta original →</a>
    </article>
  </template>

  <script src="js/app.js"></script>
</body>
</html>
