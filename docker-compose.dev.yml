# Postgres para desarrollo local. No tiene nada que ver con producción, que
# corre en Coolify con sus propias credenciales.
#
#   docker compose -f docker-compose.dev.yml up -d
#   pnpm dev:db     # aplica el esquema y carga las pegas de ejemplo
#   pnpm dev
#
# Usuario, clave y base son "pega" a propósito: son las que trae
# .env.example, para que levantar esto no requiera configurar nada.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pega
      POSTGRES_PASSWORD: pega
      POSTGRES_DB: pega
    ports:
      - '5432:5432'
    volumes:
      - pegas-dev-pg:/var/lib/postgresql/data

volumes:
  pegas-dev-pg:
